<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <!-- Link to the separate CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>Rock Paper Scissors</h1>

        <!-- Scoreboard -->
        <div class="scoreboard">
            <div class="score-box">You: <span id="user-score">0</span></div>
            <div class="score-box">Computer: <span id="comp-score">0</span></div>
        </div>

        <!-- Buttons for User Choices -->
        <div class="choices">
            <button class="choice-btn" onclick="playGame('rock')" title="Rock">✊</button>
            <button class="choice-btn" onclick="playGame('paper')" title="Paper">✋</button>
            <button class="choice-btn" onclick="playGame('scissors')" title="Scissors">✌️</button>
        </div>

        <!-- Result Display Area -->
        <div class="results">
            <div id="choices-made">Choose your weapon!</div>
            <div id="round-result" class="result-message"></div>
        </div>

        <!-- Reset Game -->
        <button class="reset-btn" onclick="resetGame()">Reset Score</button>
    </div>

    <!-- Link to the separate JavaScript file -->
    <script src="script.js"></script>
</body>

</html>
